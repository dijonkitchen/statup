# Change these first
owner: dijonkitchen # Your GitHub organization or username, where this repository lives
repo: statup # The name of this repository

sites:
  - name: dijonkitchen.org
    url: https://www.dijonkitchen.org/
  # The bare domain should redirect to www; catches DNS/registrar mistakes
  - name: Bare domain (dijonkitchen.org)
    url: https://dijonkitchen.org/
  - name: Feed
    url: https://www.dijonkitchen.org/feed.xml
  # Old domains forward to the site via Porkbun URL forwarding
  - name: dijonkitchen.com redirect
    url: https://www.dijonkitchen.com/
  - name: dijonkitchen.net redirect
    url: https://www.dijonkitchen.net/

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
#   cname: dijonkitchen.org
  baseUrl: /statup
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: dijonkitchen.org status
#   introTitle: "**Upptime** is the open-source uptime monitor and status page, powered entirely by GitHub."
#   introMessage: This is a sample status page which uses **real-time** data from our [GitHub repository](https://github.com/upptime/upptime). No server required — just GitHub Actions, Issues, and Pages. [**Get your own for free**](https://github.com/upptime/upptime)
  navbar:
    - title: Homepage
      href: https://www.dijonkitchen.org/
    - title: Feedback
      href: https://github.com/dijonkitchen/posse-bliki/issues/new

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
